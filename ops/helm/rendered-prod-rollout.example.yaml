# Source: hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qa-qa-supervisor
  labels:
    app.kubernetes.io/name: qa-supervisor
    app.kubernetes.io/instance: qa
    app.kubernetes.io/version: "2026.11.0"
    app.kubernetes.io/managed-by: Helm
    data-residency: eu
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: qa-qa-supervisor
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Pods
      pods:
        metric:
          name: qa_inflight_requests
        target:
          type: AverageValue
          averageValue: "8"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Source: networkpolicy.yaml
# Default-deny for this workload, then explicit allows. Plain NetworkPolicy cannot match FQDNs,
# so model endpoints are reached via private CIDRs (AWS VPC interface endpoints / GCP PSC) and only
# from the gateway namespace. Use CiliumNetworkPolicy toFQDNs (or an egress gateway) if FQDN rules are needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qa-qa-supervisor
  labels:
    app.kubernetes.io/name: qa-supervisor
    app.kubernetes.io/instance: qa
    app.kubernetes.io/version: "2026.11.0"
    app.kubernetes.io/managed-by: Helm
    data-residency: eu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qa-supervisor
      app.kubernetes.io/instance: qa
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: qa-ingress }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: qa-gateway }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: qa-mcp }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { protocol: TCP, port: 4317 }
    - to:
        - ipBlock: { cidr: 10.20.0.0/24 }
      ports:
        - { protocol: TCP, port: 443 }
