{{- if .Values.networkPolicy.enabled }}
# Default-deny for this workload, then explicit allows. Plain NetworkPolicy cannot match FQDNs,
# so model endpoints are reached via private CIDRs (AWS VPC interface endpoints / GCP PSC) and only
# from the gateway namespace. Use CiliumNetworkPolicy toFQDNs (or an egress gateway) if FQDN rules are needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qa.fullname" . }}
  labels: {{- include "qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "qa.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: qa-ingress }
      ports:
        - { protocol: TCP, port: {{ .Values.service.port }} }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- range .Values.networkPolicy.allowNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .name }} }
      ports:
        - { protocol: TCP, port: {{ .port }} }
    {{- end }}
    {{- range .Values.networkPolicy.modelEndpointCIDRs }}
    - to:
        - ipBlock: { cidr: {{ . }} }
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
{{- end }}
