apiVersion: apps/v1
kind: Deployment
metadata:
  name: spec-summariser
  labels:
    data-classification: restricted
spec:
  template:
    spec:
      containers:
        - name: agent
          image: docker.io/acme/agent:latest
          env:
            - name: OPENAI_API_KEY
              value: sk-not-a-real-key
