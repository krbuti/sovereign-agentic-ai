[tool.ruff]
target-version = "py311"
extend-exclude = ["ops/tools"]

[tool.ruff.lint]
# S = flake8-bandit security rules (Bandit's checks, implemented in Ruff)
select = ["S"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are expected, fake credentials are deliberate DLP/auth test inputs,
# and non-crypto randomness is fine for test data.
"**/test_*.py" = ["S101", "S105", "S106", "S311"]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
